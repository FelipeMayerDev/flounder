<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flounder · Finanças em casal</title>
  <link rel="manifest" href="/m/manifest.webmanifest">
  <link rel="icon" href="/m/art/tropical_fish.png">
  <link rel="apple-touch-icon" href="/m/art/tropical_fish.png">
  <meta name="theme-color" content="#2f6cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/m/app.css">
  <link rel="stylesheet" href="/m/screens/home.css">
  <link rel="stylesheet" href="/m/screens/cards.css">
  <link rel="stylesheet" href="/m/screens/house.css">
  <link rel="stylesheet" href="/m/screens/flow.css">
</head>
<body>
  <header class="top">
    <button class="iconbtn" id="menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <div class="avatars"><span class="avatar a0">F</span><span class="avatar a1">L</span></div>
      <div>
        <div class="brand-name">Flounder</div>
        <div class="brand-sub">Finanças em casal</div>
      </div>
    </div>
    <button class="iconbtn" id="bell" aria-label="Avisos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" id="badge">10</span>
    </button>
  </header>

  <div class="monthbar">
    <button class="seta" id="mes-antes" aria-label="Mês anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="mes" id="mes-title" aria-label="Escolher mês">—</button>
    <button class="seta" id="mes-depois" aria-label="Próximo mês">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <main id="app"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="home" aria-label="Início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg>
      <span>Início</span>
    </button>
    <button class="tab" data-tab="flow" aria-label="Fluxo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V8M12 16V4M17 16v-5"/><path d="M3 20h18"/></svg>
      <span>Fluxo</span>
    </button>
    <button class="tab" data-tab="cards" aria-label="Cartões">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/></svg>
      <span>Cartões</span>
    </button>
    <button class="tab" data-tab="house" aria-label="Casa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>
      <span>Casa</span>
    </button>
  </nav>
  <button class="fab" id="fab" aria-label="Adicionar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <script type="module" src="/m/main.js"></script>
</body>
</html>
