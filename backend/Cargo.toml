[package]
name = "flounder-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
getrandom = "=0.2.17"
axum = "=0.8.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "rt", "net", "signal", "sync", "time", "fs"] }
tokio-postgres = "=0.7.18"

[profile.release]
strip = true
lto = "thin"
