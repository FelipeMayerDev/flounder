[package]
name = "flounder"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
publish = false

resolver = "2"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "persistence"] }
egui = "=0.36.2"
egui-phosphor = "=0.14.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot", "eframe"] }

[profile.release]
strip = true
lto = "thin"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit"] }
