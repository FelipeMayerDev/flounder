name: flounder

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flounder
      POSTGRES_USER: flounder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env local}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Volume novo: aplica as migrações em ordem; o backend aplica as pendentes ao iniciar.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flounder -d flounder"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  # Só no servidor: docker compose --profile server up -d --build
  # Rede do host para escutar só no IP Tailscale (BIND_ADDR em backend/.env); se o Tailscale
  # ainda não subiu, o processo sai e o Docker tenta de novo.
  backend:
    profiles: [server]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: flounder-backend:local
    restart: unless-stopped
    network_mode: host
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
